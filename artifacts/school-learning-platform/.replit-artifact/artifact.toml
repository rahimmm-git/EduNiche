kind = "web"
previewPath = "/"
title = "School Learning Platform"
description = "A school-specific learning and teaching platform that adapts curriculum browsing, onboarding, and role-based dashboards to each user's city, board, school, class, and subjects."
version = "1.0.0"
id = "artifacts/school-learning-platform"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22766

[services.development]
run = "pnpm --filter @workspace/school-learning-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/school-learning-platform", "run", "build" ]
serve = "static"
publicDir = "artifacts/school-learning-platform/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22766"
BASE_PATH = "/"
